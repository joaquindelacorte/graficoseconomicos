<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argentina | Macro Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --sidebar-bg: #0f172a;
            --sidebar-hover: #1e293b;
            --sidebar-active: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: #020617; /* Very dark background */
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 4px 0 24px rgba(0,0,0,0.4);
            transition: width 0.3s ease;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar-header h1 {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-header p {
            margin: 4px 0 0 0;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .nav-menu {
            list-style: none;
            padding: 16px 12px;
            margin: 0;
            flex-grow: 1;
            overflow-y: auto;
        }

        .nav-item {
            margin-bottom: 8px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .nav-link:hover {
            background-color: var(--sidebar-hover);
            color: var(--text-main);
        }

        .nav-link.active {
            background-color: var(--sidebar-active);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            font-weight: 600;
        }

        .nav-icon {
            margin-right: 12px;
            font-size: 1.1rem;
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* Content Area Container */
        .content-area {
            flex-grow: 1;
            position: relative;
            background: #020617; /* Fallback */
        }

        /* Iframe Styling */
        #content-frame {
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            position: absolute;
            top: 0;
            left: 0;
        }

        #content-frame.loaded {
            opacity: 1;
        }
        
        /* Spinner for loading feeling */
        .page-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--sidebar-active);
            animation: spin 1s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes spin {
            to { transform: rotate(360deg) translate(-50%, -50%); transform-origin: 0 0; } /* Fix animation context */
        }

        /* Custom fix for the animation */
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Group labels inside sidebar */
        .nav-group-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin: 16px 0 8px 16px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>ARGENTINA</h1>
            <p>Macro Dashboard</p>
        </div>
        
        <ul class="nav-menu">
            <div class="nav-group-label">Economía</div>
            
            <li class="nav-item">
                <a class="nav-link active" onclick="loadPage('finanzas.html', this)">
                    <span class="nav-icon">🏦</span>
                    <span>Finanzas & BCRA</span>
                </a>
            </li>
            
            <li class="nav-item">
                <a class="nav-link" onclick="loadPage('comex.html', this)">
                    <span class="nav-icon">🚢</span>
                    <span>Comercio Exterior</span>
                </a>
            </li>
            
            <div class="nav-group-label">Mercado Físico & Futuros</div>
            
            <li class="nav-item">
                <a class="nav-link" onclick="loadPage('mercados.html', this)">
                    <span class="nav-icon">🌾</span>
                    <span>Agro & Carnes</span>
                </a>
            </li>
            
            <div class="nav-group-label">Operativa Logística</div>

            <li class="nav-item">
                <a class="nav-link" onclick="loadPage('index.html', this)">
                    <span class="nav-icon">🚛</span>
                    <span>Logística Camiones</span>
                </a>
            </li>
            
            <li class="nav-item">
                <a class="nav-link" onclick="loadPage('puertos4.html', this)">
                    <span class="nav-icon">📍</span>
                    <span>Monitor de Puertos</span>
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            System Control Panel v1.0
        </div>
    </aside>

    <main class="content-area">
        <div class="page-loader" id="loader"></div>
        <!-- Load finanzas by default -->
        <iframe id="content-frame" src="finanzas.html"></iframe>
    </main>

    <script>
        const iframe = document.getElementById('content-frame');
        const loader = document.getElementById('loader');

        // Handle iframe load event
        iframe.onload = () => {
            iframe.classList.add('loaded');
            // loader stays behind the opaque iframe, no need to hide aggressively
        };

        function loadPage(url, element) {
            // Update active state in sidebar
            const links = document.querySelectorAll('.nav-link');
            links.forEach(l => l.classList.remove('active'));
            element.classList.add('active');

            // Trigger load visual
            iframe.classList.remove('loaded');
            
            // Switch src after a tiny delay for smooth animation
            setTimeout(() => {
                iframe.src = url;
            }, 150);
        }
    </script>
</body>
</html>
